<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AL Transportes - Rastreamento de NF</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&family=Barlow+Condensed:wght@500;700;800&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--red:#E8002D;--red2:#c0001f;--dark:#0e0e0e;--dark2:#181818;--dark3:#222;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);--text:#f0f0f0;--muted:#888;--radius:10px}
    body{font-family:'Barlow',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center}
    .topbar{width:100%;background:#000;border-bottom:3px solid var(--red);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
    .topbar-logo{display:flex;align-items:center;gap:14px}
    .topbar-logo img{height:52px;width:auto}
    .topbar-name{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;letter-spacing:1px;color:#fff;text-transform:uppercase;line-height:1.1}
    .topbar-name span{color:var(--red)}
    .topbar-tag{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:1px}
    .topbar-right{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
    .status-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;display:inline-block;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
    .hero{width:100%;background:linear-gradient(135deg,#0f0f0f 55%,#1a0005 100%);border-bottom:1px solid var(--border);padding:26px 24px 18px;text-align:center;position:relative;overflow:hidden}
    .hero::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 22px,rgba(232,0,45,0.025) 22px,rgba(232,0,45,0.025) 23px);pointer-events:none}
    .hero h1{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:800;text-transform:uppercase;letter-spacing:2px;color:#fff;position:relative}
    .hero h1 span{color:var(--red)}
    .hero p{color:var(--muted);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin-top:5px;position:relative}
    .main{width:100%;max-width:480px;padding:24px 16px 40px}
    .chat{background:var(--dark2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;height:530px;box-shadow:0 24px 64px rgba(0,0,0,0.7)}
    .steps{display:flex;align-items:center;gap:5px;padding:10px 14px;border-bottom:1px solid var(--border);background:rgba(0,0,0,0.25)}
    .step{flex:1;height:3px;border-radius:2px;background:var(--border2);transition:background 0.3s}
    .step.active{background:var(--red)}
    .step.done{background:#22c55e}
    .steps-label{font-size:10px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;margin-left:8px}
    #msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
    #msgs::-webkit-scrollbar{width:3px}
    #msgs::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
    .msg{max-width:84%;padding:10px 14px;font-size:14px;line-height:1.55;animation:pop 0.2s ease}
    @keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    .bot{background:var(--dark3);border:1px solid var(--border);border-radius:3px 12px 12px 12px;align-self:flex-start;color:var(--text)}
    .usr{background:#8b0015;border:1px solid rgba(232,0,45,0.35);border-radius:12px 3px 12px 12px;align-self:flex-end;color:#fff}
    .bot b{color:#ff6070}
    .msg .hint{display:block;margin-top:6px;font-size:11.5px;color:var(--muted);font-style:italic}
    .summary-card{background:rgba(232,0,45,0.07);border:1px solid rgba(232,0,45,0.22);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:13px}
    .summary-card .row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
    .summary-card .row:last-child{border-bottom:none}
    .summary-card .k{color:var(--muted)}
    .summary-card .v{color:#fff;font-weight:700;font-family:'Barlow Condensed',sans-serif;font-size:13.5px;letter-spacing:0.5px}
    .senha-pill{background:rgba(232,0,45,0.18);border:1px solid rgba(232,0,45,0.4);color:#ff6070;border-radius:4px;padding:1px 8px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px}
    .opt-row{display:flex;flex-wrap:wrap;gap:7px;align-self:flex-start;animation:pop 0.25s ease}
    .opt-btn{background:var(--dark3);border:1px solid var(--border2);border-radius:20px;padding:6px 16px;font-size:12px;font-family:'Barlow',sans-serif;font-weight:700;color:var(--text);cursor:pointer;text-transform:uppercase;letter-spacing:0.5px;transition:all 0.15s}
    .opt-btn:hover{background:var(--red);border-color:var(--red);color:#fff}
    .opt-btn.danger:hover{background:#2a2a2a;border-color:#555;color:#aaa}
    .opt-btn.success:hover{background:#15803d;border-color:#22c55e;color:#fff}
    .divider{display:flex;align-items:center;gap:10px;align-self:stretch}
    .divider span{font-size:10px;color:var(--muted);white-space:nowrap;text-transform:uppercase;letter-spacing:1px;font-family:'Barlow Condensed',sans-serif}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
    .bar{display:flex;gap:8px;padding:11px 12px;border-top:1px solid var(--border);background:rgba(0,0,0,0.2)}
    #inp{flex:1;padding:9px 14px;background:var(--dark3);border:1px solid var(--border2);border-radius:8px;font-size:14px;font-family:'Barlow',sans-serif;color:var(--text);outline:none;transition:border-color 0.15s}
    #inp::placeholder{color:var(--muted)}
    #inp:focus{border-color:var(--red)}
    #send{background:var(--red);color:#fff;border:none;border-radius:8px;padding:9px 20px;font-size:12px;font-weight:800;font-family:'Barlow',sans-serif;text-transform:uppercase;letter-spacing:1px;cursor:pointer;transition:background 0.15s}
    #send:hover{background:var(--red2)}
    #send:active{transform:scale(0.97)}
    .footer{width:100%;background:#000;border-top:1px solid var(--border);padding:14px 24px;text-align:center;font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:auto}
    .footer a{color:var(--red);text-decoration:none}
  </style>
</head>

<div class="main">
  <div class="chat">
    <div class="steps" id="steps">
      <div class="step active" id="s1"></div>
      <div class="step" id="s2"></div>
      <div class="step" id="s3"></div>
      <div class="step" id="s4"></div>
      <span class="steps-label" id="step-label">Passo 1 de 4</span>
    </div>
    <div id="msgs"></div>
    <div class="bar">
      <input id="inp" placeholder="Digite sua resposta..." autocomplete="off"/>
      <button id="send">Enviar</button>
    </div>

<script>
  const msgs=document.getElementById('msgs'),inp=document.getElementById('inp'),send=document.getElementById('send');
  let state={step:'inicio',tipo:null,cnpj:null,nfs:null};
  function setSteps(n){
    const labels=['Passo 1 de 4','Passo 2 de 4','Passo 3 de 4','Passo 4 de 4','Concluido'];
    for(let i=1;i<=4;i++){const el=document.getElementById('s'+i);el.className='step'+(i<n?' done':i===n?' active':'');}
    document.getElementById('step-label').textContent=labels[Math.min(n,5)-1]||'Concluido';
  }
  function addMsg(html,who){const d=document.createElement('div');d.className='msg '+(who==='bot'?'bot':'usr');d.innerHTML=html;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;}
  function addDivider(txt){const d=document.createElement('div');d.className='divider';d.innerHTML=`<span>${txt}</span>`;msgs.appendChild(d);}
  function addOpts(opts){
    const row=document.createElement('div');row.className='opt-row';
    opts.forEach(o=>{const b=document.createElement('button');b.className='opt-btn'+(o.cls?' '+o.cls:'');b.textContent=o.label;b.onclick=()=>{row.remove();addMsg(o.label,'usr');handle(o.value);};row.appendChild(b);});
    msgs.appendChild(row);msgs.scrollTop=msgs.scrollHeight;
  }
  function formatNFs(raw){return raw.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean);}
  function validaCNPJ(v){return /^\d{14}$/.test(v.replace(/\D/g,''));}
  function submitSSW(tipo,cnpj,nfs){
    const nf_str=nfs.join('\n'),f=document.createElement('form');
    f.method='post';f.target='_blank';
    const fields=tipo==='remetente'?[['NR',nf_str],['cnpj',cnpj],['urlori','https://ssw.inf.br/ajuda/rastreamento.html']]:[['NR',nf_str],['cnpjdest',cnpj],['urlori','https://ssw.inf.br/ajuda/rastreamentodestnf.html']];
    f.action=tipo==='remetente'?'https://ssw.inf.br/2/ssw_resultSSW':'https://ssw.inf.br/2/ssw_resultSSW_dest_nro';
    fields.forEach(([n,v])=>{const i=document.createElement('input');i.type='hidden';i.name=n;i.value=v;f.appendChild(i);});
    document.body.appendChild(f);f.submit();document.body.removeChild(f);
  }
  function handle(val){
    if(state.step==='inicio'){
      state.tipo=val;state.step='cnpj';setSteps(2);
      const lb=val==='remetente'?'Remetente':'Destinat&aacute;rio';
      addMsg(`Informe o <b>CNPJ do ${lb}</b> (14 d&iacute;gitos, somente n&uacute;meros):<span class="hint">A senha de acesso &eacute; sempre os 5 primeiros d&iacute;gitos do CNPJ.</span>`,'bot');
      inp.focus();return;
    }
    if(state.step==='cnpj'){
      const limpo=val.replace(/\D/g,'');
      if(!validaCNPJ(limpo)){addMsg('CNPJ inv&aacute;lido. Digite exatamente <b>14 d&iacute;gitos</b> num&eacute;ricos.','bot');inp.focus();return;}
      state.cnpj=limpo;state.step='nfs';setSteps(3);
      const senha=limpo.substring(0,5);
      addMsg(`CNPJ aceito! Senha de acesso: <span class="senha-pill">${senha}</span><br><br>Informe os <b>n&uacute;meros das Notas Fiscais</b>:<span class="hint">Uma por linha, ou separadas por v&iacute;rgula.</span>`,'bot');
      inp.focus();return;
    }
    if(state.step==='nfs'){
      const nfs=formatNFs(val);
      if(nfs.length===0){addMsg('Informe pelo menos <b>uma nota fiscal</b>.','bot');inp.focus();return;}
      state.nfs=nfs;state.step='confirmando';setSteps(4);
      const lb=state.tipo==='remetente'?'Remetente':'Destinat&aacute;rio',senha=state.cnpj.substring(0,5);
      addMsg(`Confira os dados antes de enviar:<div class="summary-card"><div class="row"><span class="k">Tipo</span><span class="v">${lb}</span></div><div class="row"><span class="k">CNPJ</span><span class="v">${state.cnpj}</span></div><div class="row"><span class="k">Senha</span><span class="v"><span class="senha-pill">${senha}</span></span></div><div class="row"><span class="k">Qtd. NFs</span><span class="v">${nfs.length} nota${nfs.length>1?'s':''}</span></div><div class="row"><span class="k">NFs</span><span class="v" style="text-align:right;max-width:60%;word-break:break-all">${nfs.join(', ')}</span></div></div>`,'bot');
      addOpts([{label:'Rastrear agora',value:'rastrear',cls:'success'},{label:'Corrigir',value:'corrigir'},{label:'Recomecar',value:'reset',cls:'danger'}]);return;
    }
    if(state.step==='confirmando'){
      if(val==='rastrear'){
        addMsg('Enviando ao sistema SSW... abrindo em nova aba.','bot');
        setTimeout(()=>submitSSW(state.tipo,state.cnpj,state.nfs),300);
        state.step='fim';setSteps(5);
        setTimeout(()=>{addDivider('Consulta realizada');addMsg('Rastreamento aberto! Deseja fazer nova consulta?','bot');addOpts([{label:'Nova consulta',value:'nova'},{label:'Encerrar',value:'encerrar',cls:'danger'}]);},900);
      } else {resetBot();}
      return;
    }
    if(state.step==='fim'){
      if(val==='nova'){resetBot();}
      else{addMsg('Atendimento encerrado. Obrigado por usar a AL Transportes!','bot');}
      return;
    }
  }
  function resetBot(){
    state={step:'inicio',tipo:null,cnpj:null,nfs:null};setSteps(1);msgs.innerHTML='';
    addMsg('Ol&aacute;! Sou o assistente de rastreamento da <b>AL Transportes LTDA</b>.<br>Como deseja rastrear sua Nota Fiscal?','bot');
    addOpts([{label:'Remetente',value:'remetente'},{label:'Destinatario',value:'destinatario'}]);
  }
  function handleInput(){const v=inp.value.trim();if(!v)return;inp.value='';addMsg(v,'usr');handle(v);}
  send.onclick=handleInput;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleInput();}});
  resetBot();
</script>
